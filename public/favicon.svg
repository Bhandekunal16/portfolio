<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="kb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Inner Border Glow -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#kb-grad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Code bracket accent / geometric dot -->
  <circle cx="50" cy="14" r="3" fill="#06b6d4" />

  <!-- Monogram KB Text in JetBrains / Clean Geometry -->
  <text 
    x="32" 
    y="41" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="24" 
    letter-spacing="-0.5" 
    fill="url(#kb-grad)"
  >
    KB
  </text>
</svg>
